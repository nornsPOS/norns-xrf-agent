name: build
on:
  workflow_dispatch:
  push:
    branches: [main, fix/result-reception]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo test --locked --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Installed task and restart
        shell: pwsh
        run: scripts/windows-probe.ps1 -Programm "$pwd/target/release/norns-xrf-agent.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: norns-xrf-agent
          path: target/release/norns-xrf-agent.exe
          if-no-files-found: error
