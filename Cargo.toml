[package]
name = "norns-xrf-agent"
version = "1.4.0"
edition = "2021"
description = "Der Bote: traegt die Messungen des Pruefgeraets zur Kasse."

[[bin]]
name = "norns-xrf-agent"
path = "src/main.rs"

[dependencies]
# Bewusst wenig: SQLite mitgeliefert (kein zweites Stueck auf dem Geraet),
# und JSON. Der Webdienst ist von Hand geschrieben, weil eine ganze
# Web-Bibliothek fuer drei Adressen zu viel Gewicht auf einem Geraet ist,
# das messen soll und nicht bedienen.
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
roxmltree = "0.20"
# ⛔ B23: das Botenwort braucht Zufall vom Betriebssystem, nicht aus der Uhr.
# Eine Kiste ohne eigene Abhaengigkeiten, also kein Gewicht im Sinne oben.
getrandom = "0.2"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
